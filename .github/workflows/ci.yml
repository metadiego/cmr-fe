name: CI

# El despliegue lo hace Vercel, no este workflow: aquí NO se despliega nada. Esto es
# solo la puerta — typecheck, lint, tests y build sobre cada PR y cada push a main.
# Hasta hoy el FE era el único de los dos repos que llegaba a producción sin que nada
# lo mirara: 66 páginas y 165 componentes con la suite corriendo solo en un portátil.
# See cmr-be/.github/workflows/deploy.yml para la puerta equivalente del backend.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo sobre la misma rama cancela el run anterior: no tiene sentido pagar
# por validar un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest

    env:
      # Valores FALSOS, a propósito. `lib/env.ts` revienta al importarse si faltan, así
      # que el build los exige; pero el build no llama a Supabase ni al API, solo compila.
      # Nada aquí es un secreto y nada de esto llega a producción — eso lo pone Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-not-a-real-anon-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 no es opcional: `npm test` corre con `--experimental-strip-types`, que
      # no existe antes de 22.6. Con Node 20 los tests no fallan — no llegan a correr.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Bloquea desde el primer día, al contrario que en el backend. Allí el lint quedó
      # en advisory por una deuda de cientos de ficheros y sigue sin bloquear; aquí el
      # repo está limpio (0 errores) y la puerta se pone mientras es gratis ponerla.
      # Los 4 warnings que hay hoy NO tumban el run: `eslint` solo falla con errores.
      # Cuando lleguen a cero, añadir `--max-warnings 0` al script y ya no vuelven.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
